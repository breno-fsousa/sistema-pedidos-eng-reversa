<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testes — Pastelaria do Zé (MVC)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0f0e17;
      --surface: #1a1930;
      --green:   #4ecca3;
      --red:     #e94560;
      --accent:  #ff6b35;
      --muted:   #a7a9be;
      --text:    #fffffe;
      --blue:    #6c63ff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      padding: 2rem;
      min-height: 100vh;
    }

    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #f7c59f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .3rem;
    }

    .subtitulo {
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .06em;
    }

    #output {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      max-width: 720px;
    }

    .grupo {
      margin-top: 1.2rem;
      margin-bottom: .3rem;
      font-family: 'Syne', sans-serif;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--blue);
      padding-left: .2rem;
    }

    .teste {
      display: flex;
      align-items: flex-start;
      gap: .75rem;
      background: var(--surface);
      border-radius: 8px;
      padding: .6rem 1rem;
      font-size: .82rem;
      line-height: 1.4;
      border-left: 3px solid transparent;
      transition: border-color .2s;
    }
    .teste.ok  { border-left-color: var(--green); }
    .teste.err { border-left-color: var(--red);   }

    .icone { font-size: 1rem; flex-shrink: 0; margin-top: .05rem; }

    .descricao { color: var(--text); }
    .erro-msg  { color: var(--red); font-size: .75rem; margin-top: .2rem; }

    .resumo {
      margin-top: 1.8rem;
      padding: 1.2rem 1.5rem;
      background: var(--surface);
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      border: 1px solid rgba(255,255,255,.08);
    }
    .resumo.tudo-ok  { border-color: rgba(78,204,163,.3);  color: var(--green); }
    .resumo.tem-erro { border-color: rgba(233,69,96,.3);   color: var(--red);   }

    .barra {
      height: 4px;
      background: rgba(255,255,255,.06);
      border-radius: 2px;
      margin-top: 1.5rem;
      max-width: 720px;
      overflow: hidden;
    }
    .barra-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width .6s ease;
    }
    .barra-fill.parcial { background: var(--red); }
  </style>
</head>
<body>

  <header>
    <h1>🧪 Runner de Testes — MVC</h1>
    <p class="subtitulo">Pastelaria do Zé · IFCE Boa Viagem · Arquitetura de Sistemas</p>
  </header>

  <div id="output">
    <p style="color:var(--muted); font-size:.85rem">Carregando testes...</p>
  </div>

  <!-- Código de produção (ordem de dependência) -->
  <script src="../src/models/Produto.js"></script>
  <script src="../src/models/ItemPedido.js"></script>
  <script src="../src/models/Pedido.js"></script>
  <script src="../src/models/Factories.js"></script>
  <script src="../src/services/EventBus.js"></script>
  <script src="../src/services/DescontoService.js"></script>
  <script src="../src/services/PedidoService.js"></script>
  <script src="../src/repositories/PedidoRepository.js"></script>

  <!-- Suite de testes -->
  <script src="pedido.test.js"></script>

  <!-- Renderização dos resultados -->
  <script>
    const out = document.getElementById("output");
    out.innerHTML = "";

    // Agrupa testes por prefixo [Grupo]
    const grupos = {};
    relatorio.resultados.forEach((r) => {
      const match = r.descricao.match(/^\[([^\]]+)\]/);
      const grupo = match ? match[1] : "Geral";
      if (!grupos[grupo]) grupos[grupo] = [];
      grupos[grupo].push(r);
    });

    Object.entries(grupos).forEach(([nome, testes]) => {
      const g = document.createElement("div");
      g.className = "grupo";
      g.textContent = `▸ ${nome}`;
      out.appendChild(g);

      testes.forEach((r) => {
        const div = document.createElement("div");
        div.className = `teste ${r.ok ? "ok" : "err"}`;

        const icone = document.createElement("span");
        icone.className = "icone";
        icone.textContent = r.ok ? "✅" : "❌";

        const corpo = document.createElement("div");
        const desc = document.createElement("div");
        desc.className = "descricao";
        desc.textContent = r.descricao;
        corpo.appendChild(desc);

        if (r.erro) {
          const err = document.createElement("div");
          err.className = "erro-msg";
          err.textContent = "↳ " + r.erro;
          corpo.appendChild(err);
        }

        div.appendChild(icone);
        div.appendChild(corpo);
        out.appendChild(div);
      });
    });

    // Barra de progresso
    const barra = document.createElement("div");
    barra.className = "barra";
    const fill = document.createElement("div");
    fill.className = "barra-fill" + (relatorio.failed > 0 ? " parcial" : "");
    const pct = Math.round((relatorio.passed / relatorio.total) * 100);
    fill.style.width = "0%";
    barra.appendChild(fill);
    out.appendChild(barra);
    setTimeout(() => { fill.style.width = pct + "%"; }, 100);

    // Resumo final
    const resumo = document.createElement("div");
    resumo.className = "resumo " + (relatorio.failed === 0 ? "tudo-ok" : "tem-erro");
    resumo.innerHTML = relatorio.failed === 0
      ? `🎉 Todos os ${relatorio.total} testes passaram!`
      : `⚠ ${relatorio.passed}/${relatorio.total} passaram — ${relatorio.failed} falha(s)`;
    out.appendChild(resumo);
  </script>
</body>
</html>
